            "@type": "Question",
            "name": "How do I book my first home visit?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Call or message us on WhatsApp with your area in Pune, your concern and a preferred time. We discuss your needs, confirm availability and explain the visit fee before you book."
            }
          },
          {
            "@type": "Question",
            "name": "Who comes to my home?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A qualified physiotherapist with at least a BPT degree visits you. MPT guidance is available for complex neurological, paediatric and post-surgical cases. Every visit is one-to-one."
            }
          },
          {
            "@type": "Question",
            "name": "What does a session cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Pricing depends on your location and care needs. Contact us for a per-visit quote before booking. You can ask about the recommended frequency after your initial assessment."
            }
          },
          {
            "@type": "Question",
            "name": "What should I have ready?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Wear comfortable clothes and keep a mat or bedsheet, a sturdy chair and a little space to move. Have any relevant prescriptions, scans or discharge summaries handy. Your physiotherapist brings the equipment needed for your session."
            }
          },
          {
            "@type": "Question",
            "name": "Can I book care for my parents from another city?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can arrange a visit for your parents in Pune from anywhere. We coordinate the visit with your family and can share progress updates with the patient’s permission."
            }
          },
          {
            "@type": "Question",
            "name": "How many sessions will I need?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your needs, goals and progress determine the plan. The first assessment helps your physiotherapist recommend a starting schedule, which is reviewed as you progress. Recovery timelines vary from person to person."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need a doctor’s referral?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You can contact us directly. If you have a prescription or post-surgical protocol, share it with your physiotherapist. Some conditions need further medical assessment or clinic equipment; we discuss this with you when appropriate."
            }
          }
        ]
