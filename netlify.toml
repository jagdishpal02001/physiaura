[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — required for Netlify so deep links / refresh never 404.
# Your site uses hash anchors (#how, #faq…), but this keeps routing future-proof
# when you add /book, /areas, etc. in Phase 2.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets aggressively, never cache HTML
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
